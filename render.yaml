services:
  - type: web
    name: shiftsense
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_ENDPOINT
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false # set in the Render dashboard; never commit it. Leave empty to run the fake model.
      - key: SHIFTSENSE_FIXED_NOW
        value: "true"
