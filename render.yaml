services:
  - type: web
    name: shiftsense
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false # free key from console.groq.com; set in the Render dashboard. Empty = fake model.
      # Any OpenAI-compatible endpoint instead of Groq: set LLM_API_KEY (+ LLM_ENDPOINT, LLM_MODEL).
      - key: SHIFTSENSE_FIXED_NOW
        value: "true"
