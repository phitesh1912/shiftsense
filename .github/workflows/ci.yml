name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx"
      - name: scenario eval (fake model, offline)
        run: dotnet run --no-build -c Release --project eval/ShiftSense.Eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-fake
          path: eval/results/

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shiftsense:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
